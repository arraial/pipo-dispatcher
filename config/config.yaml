# Application name
app: &app_name pipo.dispatcher
telemetry:
  service: *app_name
  local: false
  log:
    level: INFO
    encoding: utf-8
    format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
  metrics:
    service: *app_name
    endpoint: "/metrics"
probes:
  host: "0.0.0.0"
  port: 8080
  timeout:
    read: 3
    write: 10
  log_level: info
  liveness:
    timeout: 5
    status_code: 204
    endpoint: "/livez"
  readiness:
    timeout: 5
    endpoint: "/readyz"
queue:
  broker:
    url:
    host:
    vhost:
    port:
    timeout: 240
    graceful_timeout: 480     # TODO check if (mili)seconds
    max_consumers: 10
    buffer_size: 100
  service:
    parking_lot:
      queue: &plq plq
      durable: true
    dead_letter:
      exchange:
        name: &dlx dlx
        durable: true
      queue:
        name: dlq
        routing_key: "dl.#"
        durable: true
        args:
          x-queue-type: quorum
          x-delivery-limit: 3
          x-dead-letter-exchange: *plq # match service.parking_lot
          message-ttl: 86400000        # 24 hour
    dispatcher:
      exchange:
        type: direct
        name: dispatcher
        durable: true
      queue:
        name: dispatcher
        routing_key: dispatcher
        durable: true
        args:
          x-dead-letter-exchange: *dlx   # match service.dead_letter.exchange.name
          x-dead-letter-routing-key: "dl.dispatcher"
          x-queue-type: quorum
          x-delivery-limit: 20
          message-ttl: 3600000  # 1 hour
    transmuter:
      exchange:
        type: topic
        name: providers
        routing_key: provider
        durable: true